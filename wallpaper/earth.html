<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Code Ripple — Live Wallpaper</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #0c0d11;
  }
  body.light { background: #f6f6f3; }
  #view {
    position: fixed;
    display: block;
    pointer-events: none;
    opacity: 0;
    transition: opacity 600ms ease-out;
  }
  #hint {
    position: fixed;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%);
    font: 12px/1.6 ui-monospace, Menlo, Consolas, monospace;
    color: rgba(160, 175, 200, 0.55);
    letter-spacing: .08em;
    pointer-events: none;
    opacity: 1;
    transition: opacity 1.2s ease-out;
  }
  #hint.gone { opacity: 0; }
</style>
</head>
<body>
<canvas id="view" aria-hidden="true"></canvas>
<div id="hint">click · move</div>
<script>
/*
 * Code Ripple — a standalone live wallpaper.
 *
 * The same effect as the Claude desktop landing texture: a wind-lit field of
 * monospace glyphs, a warm comet that follows the pointer, and click ripples
 * that scramble the characters they pass. One WebGL2 draw for the wind field,
 * one for the glyphs.
 *
 * Query parameters (all optional):
 *   theme=dark|light   colour scheme                   (default dark)
 *   cell=6.5           cell width in CSS pixels         (default 6.5)
 *   look=mixed|lettered|figured                         (default mixed)
 *   seed=12345         fix the wind for a repeatable look
 *   auto=0|1           automatic ripples when idle      (default 1)
 */
(function () {
  'use strict';

  var params = new URLSearchParams(location.search);
  var EXPLICIT_THEME = params.get('theme');
  var CAPTURE = params.get('capture') === '1';
  var CONFIG = {
    strength: { scale: 1, base: 0.26, cap: 0.9, rest: 0.03 },
    surface: { fill: 1, weight: 300, glyphCss: 9 },
    wind: {
      energy: 1, friction: 0.6, flick: 1.2, lull: 0.5, streak: 0.4,
      detail: 0.6, edge: 0.75, curl: 0.65, wisp: 0.5, tail: 0.35,
      sweep: 0.3, morph: 3, revealS: 4,
    },
    glow: { amount: 1, headroom: 3, color: { dark: [0.1, 0.68, 1], light: [0, 0.25, 1] } },
    touch: { stir: 1, ripple: 1, slowPxS: 60, fastPxS: 800 },
    composition: { card: { centerY: 0.45, calmX: 250, calmY: 80, left: 0.3 } },
    grid: { cellCss: 6.5, minCols: 24, minRows: 8, maxDevicePixels: 21e6 },
    power: { frameMs: 40, rippleFrameMs: 10, resizeSettleMs: 150 },
  };
  if (params.get('cell')) {
    var cellParam = parseFloat(params.get('cell'));
    if (cellParam >= 4 && cellParam <= 24) CONFIG.grid.cellCss = cellParam;
  }

  // Theme: ?theme= wins; otherwise follow the host page, which may be light or
  // dark and may switch at runtime (the Codex shell does).
  function luminanceOf(color) {
    return (0.2126 * color[0] + 0.7152 * color[1] + 0.0722 * color[2]) / 255;
  }
  function sampleColor(value) {
    var probe = document.createElement('canvas').getContext('2d');
    if (!probe) return null;
    probe.fillStyle = '#000';
    probe.fillStyle = value;
    probe.fillRect(0, 0, 1, 1);
    var d = probe.getImageData(0, 0, 1, 1).data;
    return [d[0], d[1], d[2], d[3] / 255];
  }
  function detectHostTheme() {
    if (EXPLICIT_THEME === 'light' || EXPLICIT_THEME === 'dark') return EXPLICIT_THEME;
    // The app usually paints on a wrapper, not on <body>, so probe what is
    // actually behind the canvas at the centre of the screen and walk up from
    // there: the first opaque surface is what the glyphs will sit on.
    var probeEl = null;
    try { probeEl = document.elementFromPoint(window.innerWidth / 2, window.innerHeight / 2); } catch (error) { }
    while (probeEl) {
      var surface = sampleColor(getComputedStyle(probeEl).backgroundColor);
      if (surface && surface[3] > 0.5) return luminanceOf(surface) > 0.55 ? 'light' : 'dark';
      probeEl = probeEl.parentElement;
    }
    var nodes = [document.body, document.documentElement];
    for (var i = 0; i < nodes.length; i++) {
      if (!nodes[i]) continue;
      var bg = sampleColor(getComputedStyle(nodes[i]).backgroundColor);
      if (bg && bg[3] > 0.5) return luminanceOf(bg) > 0.55 ? 'light' : 'dark';
    }
    var scheme = getComputedStyle(document.documentElement).colorScheme || '';
    if (scheme.indexOf('light') >= 0 && scheme.indexOf('dark') < 0) return 'light';
    if (scheme.indexOf('dark') >= 0 && scheme.indexOf('light') < 0) return 'dark';
    if (window.matchMedia) return window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    return 'dark';
  }

  var THEME = detectHostTheme();
  var INK = THEME === 'light' ? [0.11, 0.13, 0.19] : [0.91, 0.93, 0.97];
  var GLOW = CONFIG.glow.color[THEME];
  var OPACITY = Math.min(1, Math.min(CONFIG.strength.base * CONFIG.strength.scale, CONFIG.strength.cap) * CONFIG.glow.headroom);

  function applyTheme(theme) {
    THEME = theme;
    INK = theme === 'light' ? [0.11, 0.13, 0.19] : [0.91, 0.93, 0.97];
    GLOW = CONFIG.glow.color[theme];
    if (window.__CODE_RIPPLE_EMBEDDED__ !== true && document.body) {
      document.body.classList.toggle('light', theme === 'light');
    }
    if (typeof gl !== 'undefined' && gl && typeof glyphProgram !== 'undefined' && glyphProgram) {
      gl.useProgram(glyphProgram);
      gl.uniform3f(loc(glyphProgram, 'u_color'), INK[0], INK[1], INK[2]);
      gl.uniform3f(loc(glyphProgram, 'u_glowColor'), GLOW[0], GLOW[1], GLOW[2]);
      // Dark ink on white needs more weight than light ink on black: lift the
      // gain and give every cell a small floor so the field is visible at rest.
      gl.uniform1f(loc(glyphProgram, 'u_inkAlpha'), theme === 'light' ? 2.4 : 1.0);
      gl.uniform1f(loc(glyphProgram, 'u_floor'), theme === 'light' ? 0.09 : 0.0);
    }
  }

  function watchTheme() {
    if (EXPLICIT_THEME) return;
    var current = THEME;
    var check = function () {
      var next = detectHostTheme();
      if (next !== current) {
        current = next;
        applyTheme(next);
      }
    };
    try {
      var mo = new MutationObserver(check);
      mo.observe(document.documentElement, { attributes: true, attributeFilter: ['class', 'data-theme', 'style'] });
      if (document.body) mo.observe(document.body, { attributes: true, attributeFilter: ['class', 'data-theme', 'style'] });
    } catch (error) { }
    if (window.matchMedia) {
      var mq = window.matchMedia('(prefers-color-scheme: light)');
      if (mq.addEventListener) mq.addEventListener('change', check);
    }
    setInterval(check, 1500);
  }

  var GLYPHS = (function () {
    var chars = [];
    for (var code = 32; code <= 126; code++) chars.push(String.fromCharCode(code));
    chars.push('\u00B7');
    return chars.join('');
  })();
  var ATLAS_COLS = 16;
  var ATLAS_ROWS = 6;
  var LOOKS = {
    mixed: 'ab0cAde1fEgh2iGjk3lHmn4oKpq5rMst6uRvw7xSyz8nT9eW',
    lettered: 'abcd3efgRhijk7lmnAopqr0stuEvwxy5zaeKiou2gcS9',
    figured: '0a1b2C3d4e5F6g7h8i9J0k1m2N3p4q5R6s7t8U9v0w1X2y3z',
  };

  function hash32(value) {
    var t = value >>> 0;
    t = Math.imul(t ^ (t >>> 16), 569420461);
    t = Math.imul(t ^ (t >>> 15), 1935289751);
    return (t ^ (t >>> 15)) >>> 0;
  }
  function randomStream(seed, salt) {
    var state = hash32(seed);
    for (var i = 0; i < salt.length; i++) state = hash32(state ^ salt.charCodeAt(i));
    return function () {
      state = (state + 2654435769) >>> 0;
      return hash32(state) / 4294967296;
    };
  }
  function headingOf(t) {
    var edge = Math.PI / 10;
    var angle = edge + (Math.PI / 4.3 - edge) * ((t * 2) % 1);
    return t < 0.5 ? angle : Math.PI - angle;
  }
  function windParams(seed, look) {
    var next = randomStream(seed, 'wind');
    var between = function (a, b) { return a + (b - a) * next(); };
    return {
      key: look in LOOKS ? look : 'mixed',
      seed: seed >>> 0,
      heading: headingOf(next()),
      speed: between(42, 64),
      gustLength: between(380, 560),
      gustWidth: between(120, 190),
      bend: between(60, 110),
      bendScale: between(300, 440),
    };
  }
  function measureFont(family, cellWidth, dpr) {
    var weight = dpr >= 1.5 ? CONFIG.surface.weight : CONFIG.surface.weight + 100;
    var ctx = document.createElement('canvas').getContext('2d');
    var advance = 0.6;
    if (ctx) {
      ctx.font = weight + ' 100px ' + family;
      advance = ctx.measureText('0').width / 100 || 0.6;
    }
    return {
      family: family,
      weight: weight,
      px: Math.min(Math.round(CONFIG.surface.glyphCss * dpr), Math.floor((cellWidth - 2) / advance)),
    };
  }
  function buildAtlas(family, cellWidth, cellHeight) {
    var font = measureFont(family, cellWidth, window.devicePixelRatio || 1);
    var atlas = document.createElement('canvas');
    atlas.width = ATLAS_COLS * cellWidth;
    atlas.height = ATLAS_ROWS * cellHeight;
    var ctx = atlas.getContext('2d', { willReadFrequently: true });
    if (!ctx) return null;
    ctx.font = font.weight + ' ' + font.px + 'px ' + font.family;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = 'white';
    var metrics = ctx.measureText('Mg|');
    var baseline = Math.round((cellHeight - (metrics.fontBoundingBoxAscent + metrics.fontBoundingBoxDescent)) / 2 + metrics.fontBoundingBoxAscent);
    var advance = ctx.measureText('0').width;
    var inset = Math.floor((cellWidth - advance) / 2);
    var missing = GLYPHS.split('').map(function (glyph, index) {
      if (Math.abs(ctx.measureText(glyph).width - advance) > 0.5) return true;
      var x = (index % ATLAS_COLS) * cellWidth;
      var y = Math.floor(index / ATLAS_COLS) * cellHeight;
      ctx.save();
      ctx.beginPath();
      ctx.rect(x, y, cellWidth, cellHeight);
      ctx.clip();
      ctx.fillText(glyph, x + inset, y + baseline);
      ctx.restore();
      return false;
    });
    var pixels = ctx.getImageData(0, 0, atlas.width, atlas.height).data;
    var coverage = new Uint8Array(atlas.width * atlas.height);
    for (var i = 0; i < coverage.length; i++) coverage[i] = pixels[i * 4 + 3] || 0;
    return { coverage: coverage, missing: missing, width: atlas.width, height: atlas.height };
  }
  function measureGlyphs(coverage, cellWidth, cellHeight) {
    var rowLength = ATLAS_COLS * cellWidth;
    var boxes = new Uint8Array(384);
    var threshold = 8;
    for (var g = 0; g < 96; g++) {
      var baseX = (g % ATLAS_COLS) * cellWidth;
      var baseY = Math.floor(g / ATLAS_COLS) * cellHeight;
      var minX = cellWidth, minY = cellHeight, maxX = -1, maxY = -1;
      for (var y = 0; y < cellHeight; y++) {
        for (var x = 0; x < cellWidth; x++) {
          if ((coverage[(baseY + y) * rowLength + baseX + x] || 0) >= threshold) {
            if (x < minX) minX = x;
            if (y < minY) minY = y;
            if (x > maxX) maxX = x;
            if (y > maxY) maxY = y;
          }
        }
      }
      if (maxX >= 0) boxes.set([minX, minY, maxX - minX + 1, maxY - minY + 1], g * 4);
    }
    return boxes;
  }
  function buildSequence(look, missing) {
    var source = LOOKS[look] || LOOKS.mixed;
    var indices = source.split('').map(function (glyph) { return GLYPHS.indexOf(glyph); })
      .filter(function (index) { return index > 0 && missing[index] !== true; });
    return Uint8Array.from(indices.length ? indices : [GLYPHS.indexOf('.')]);
  }

  var N = function (v) { return Number.isInteger(v) ? v + '.0' : String(v); };

  var SH_PCG = '\n' +
'uint pcg(uint v) {\n' +
'  uint s = v * 747796405u + 2891336453u;\n' +
'  uint w = ((s >> ((s >> 28u) + 4u)) ^ s) * 277803737u;\n' +
'  return (w >> 22u) ^ w;\n' +
'}\n' +
'float unit(uint h) { return float(h >> 8u) * (1.0 / 16777216.0); }\n';

  var SH_NOISE = '\n' +
'float value(uint v) { return unit(pcg(v)) * 2.0 - 1.0; }\n' +
'float noise(vec3 p, uint salt) {\n' +
'  vec3 fl = floor(p), f = p - fl;\n' +
'  ivec3 i = ivec3(fl);\n' +
'  vec3 w = f * f * f * (f * (f * 6.0 - 15.0) + 10.0);\n' +
'  uint x0 = uint(i.x), x1 = uint(i.x + 1), y0 = uint(i.y), y1 = uint(i.y + 1);\n' +
'  uint z0 = pcg(uint(i.z) ^ u_seed ^ salt), z1 = pcg(uint(i.z + 1) ^ u_seed ^ salt);\n' +
'  uint a = pcg(y0 ^ z0), b = pcg(y1 ^ z0), c = pcg(y0 ^ z1), d = pcg(y1 ^ z1);\n' +
'  return mix(\n' +
'    mix(mix(value(x0 ^ a), value(x1 ^ a), w.x), mix(value(x0 ^ b), value(x1 ^ b), w.x), w.y),\n' +
'    mix(mix(value(x0 ^ c), value(x1 ^ c), w.x), mix(value(x0 ^ d), value(x1 ^ d), w.x), w.y),\n' +
'    w.z);\n' +
'}\n';

  var SH_TAPS = '\n' +
'uniform float u_now;\n' +
'uniform int u_tapCount;\n' +
'uniform vec4 u_taps[6];\n' +
'float heart(vec2 u) {\n' +
'  float k = -u.x * u.x * u.y * u.y * u.y;\n' +
'  float c = sign(k) * pow(abs(k), 1.0 / 3.0);\n' +
'  float r = 1.0;\n' +
'  for (int i = 0; i < 6; i++) r = sqrt(max(0.05, 1.0 + c * pow(r, 5.0 / 3.0)));\n' +
'  return r;\n' +
'}\n' +
'vec4 tapsAt(vec2 p, out vec2 glow) {\n' +
'  vec4 sum = vec4(0.0);\n' +
'  glow = vec2(0.0);\n' +
'  for (int i = 0; i < 6; i++) {\n' +
'    if (i >= u_tapCount) break;\n' +
'    vec4 tap = u_taps[i];\n' +
'    float age = u_now - tap.z;\n' +
'    vec2 away = p - tap.xy;\n' +
'    float d = length(away);\n' +
'    float reach = tap.w < 0.0 ? d / heart(away / max(d, 1.0)) : d;\n' +
'    float behind = 620.0 * (1.0 - exp(-age / 1.3)) - reach;\n' +
'    float width = 85.0 + 60.0 * age;\n' +
'    float front = smoothstep(-16.0, 10.0, behind) * exp(-behind * behind / (width * width));\n' +
'    float swell = abs(tap.w) * exp(-age / 1.5) * front;\n' +
'    sum.xy += (away / max(d, 1.0)) * (44.0 * swell);\n' +
'    sum.z += 1.9 * swell * (0.25 + 0.75 * cos(behind * (6.2831853 / 130.0)));\n' +
'    sum.w += swell;\n' +
'    float trail = smoothstep(0.0, 70.0, behind) * exp(-max(behind, 0.0) / 260.0);\n' +
'    glow.x += abs(tap.w) * (exp(-age / 1.0) * front + 0.7 * exp(-age / 1.3) * trail);\n' +
'    glow.y += abs(tap.w) * (1.0 - exp(-age / 0.2)) * exp(-age / 1.2) * trail;\n' +
'  }\n' +
'  return sum;\n' +
'}\n';

  var SH_WARM = '\n' +
'uniform int u_wakeCount;\n' +
'uniform vec4 u_wakes[48];\n' +
'uniform vec4 u_ways[48];\n' +
'float warmthAt(vec2 p) {\n' +
'  float warmth = 0.0;\n' +
'  for (int i = 0; i < 48; i++) {\n' +
'    if (i >= u_wakeCount) break;\n' +
'    vec4 wake = u_wakes[i];\n' +
'    vec3 way = u_ways[i].xyz;\n' +
'    vec2 away = p - wake.xy;\n' +
'    away -= way.xy * clamp(dot(away, way.xy), -way.z, way.z);\n' +
'    warmth += wake.z * exp(-dot(away, away) * wake.w);\n' +
'  }\n' +
'  return 1.0 - exp(-1.5 * warmth);\n' +
'}\n';

  var WIND_VERT = '#version 300 es\n' +
'precision highp float;\nprecision highp int;\n' +
'uniform uint u_seed;\nuniform float u_time;\nuniform vec4 u_wind;\nuniform vec2 u_canvasCss;\nout vec4 v_air;\n' +
SH_PCG + SH_NOISE +
'void main() {\n' +
'  vec2 corner = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2));\n' +
'  gl_Position = vec4(corner * 2.0 - 1.0, 0.0, 1.0);\n' +
'  vec2 heading = vec2(cos(u_wind.x), sin(u_wind.x));\n' +
'  float carried = u_wind.y * (u_time + 1.0 * noise(vec3(u_time * 0.09, 3.7, 0.0), 0x58u));\n' +
'  v_air = vec4(heading, carried, 0.58 * (abs(heading.x) * u_canvasCss.x + abs(heading.y) * u_canvasCss.y));\n' +
'}\n';

  var WIND_FRAG = '#version 300 es\n' +
'precision highp float;\nprecision highp int;\n' +
'uniform uint u_seed;\n' +
'uniform vec2 u_sampleCss, u_originCss, u_paneCss;\n' +
'uniform float u_time, u_reveal;\n' +
'uniform vec4 u_wind;\nuniform vec4 u_gust;\nuniform vec4 u_shape;\n' +
'uniform float u_tail, u_sweep;\nuniform float u_morph;\n' +
'uniform float u_hero;\n' +
'uniform float u_heroEarth;\n' +
'uniform highp sampler2D u_earth;\n' +
'in vec4 v_air;\nout vec4 o;\n' +
'const float TAU = 6.2831853;\n' +
'const vec2 CALM = vec2(' + N(CONFIG.composition.card.calmX) + ', ' + N(CONFIG.composition.card.calmY) + ');\n' +
'const float CALM_LEFT = ' + N(CONFIG.composition.card.left) + ';\n' +
'const float CARD_Y = ' + N(CONFIG.composition.card.centerY) + ';\n' +
SH_PCG + SH_NOISE + SH_TAPS + SH_WARM +
'vec3 slope(uint v) {\n' +
'  uint h = pcg(v);\n' +
'  return vec3(float(h & 1023u), float((h >> 10u) & 1023u), float((h >> 20u) & 1023u)) * (2.0 / 1023.0) - 1.0;\n' +
'}\n' +
'float swirl(vec3 p, uint salt) {\n' +
'  vec3 fl = floor(p), f = p - fl;\n' +
'  ivec3 i = ivec3(fl);\n' +
'  vec3 w = f * f * f * (f * (f * 6.0 - 15.0) + 10.0);\n' +
'  uint x0 = uint(i.x), x1 = uint(i.x + 1), y0 = uint(i.y), y1 = uint(i.y + 1);\n' +
'  uint z0 = pcg(uint(i.z) ^ u_seed ^ salt), z1 = pcg(uint(i.z + 1) ^ u_seed ^ salt);\n' +
'  uint a = pcg(y0 ^ z0), b = pcg(y1 ^ z0), c = pcg(y0 ^ z1), d = pcg(y1 ^ z1);\n' +
'  return 1.5 * mix(\n' +
'    mix(mix(dot(slope(x0 ^ a), f), dot(slope(x1 ^ a), f - vec3(1.0, 0.0, 0.0)), w.x),\n' +
'        mix(dot(slope(x0 ^ b), f - vec3(0.0, 1.0, 0.0)), dot(slope(x1 ^ b), f - vec3(1.0, 1.0, 0.0)), w.x), w.y),\n' +
'    mix(mix(dot(slope(x0 ^ c), f - vec3(0.0, 0.0, 1.0)), dot(slope(x1 ^ c), f - vec3(1.0, 0.0, 1.0)), w.x),\n' +
'        mix(dot(slope(x0 ^ d), f - vec3(0.0, 1.0, 1.0)), dot(slope(x1 ^ d), f - vec3(1.0)), w.x), w.y),\n' +
'    w.z);\n' +
'}\n' +
'float gustsAt(vec2 at, float carried) {\n' +
'  float gain = mix(0.38, 0.62, u_shape.x);\n' +
'  float gust = 0.0, weight = 1.0, power = 0.0;\n' +
'  vec2 size = vec2(0.85, 0.75) * u_wind.zw;\n' +
'  for (int i = 0; i < 4; i++) {\n' +
'    float k = float(i);\n' +
'    gust += weight * swirl(vec3((at.x - carried * (1.0 + 0.1 * k)) / size.x, at.y / size.y, u_morph * u_time * (0.03 + 0.018 * k) + 11.0 * k), 0x60u + uint(i));\n' +
'    power += weight * weight;\n' +
'    weight *= gain;\n' +
'    size *= vec2(0.5, 0.58);\n' +
'  }\n' +
'  float strand = 1.0 - abs(swirl(vec3((at.x - 1.15 * carried) / (0.7 * u_wind.z), at.y / (0.95 * u_wind.w), u_morph * u_time * 0.05 + 2.0), 0x66u));\n' +
'  float span = v_air.w;\n' +
'  float swell = cos((at.x - carried + 0.5 * span * noise(vec3(u_time * 0.045, at.y / (2.5 * u_wind.w), 7.0), 0x67u)) * (TAU / span));\n' +
'  return gust * inversesqrt(power) + u_shape.w * 0.5 * (strand * strand * strand - 0.35) + u_sweep * swell;\n' +
'}\n' +
'void main() {\n' +
'  vec2 p = u_originCss + gl_FragCoord.xy * u_sampleCss;\n' +
'  vec2 heading = v_air.xy;\n' +
'  vec2 across = vec2(-heading.y, heading.x);\n' +
'  vec4 hand = vec4(0.0);\n' +
'  float warm = 0.0;\n' +
'  if (u_tapCount + u_wakeCount > 0) {\n' +
'    vec2 near = p + 24.0 * vec2(\n' +
'      noise(vec3(p / 95.0, u_now * 0.12), 0x71u),\n' +
'      noise(vec3(p / 95.0 + 9.1, u_now * 0.12 + 4.0), 0x72u));\n' +
'    vec2 glow;\n' +
'    hand = tapsAt(near, glow);\n' +
'    warm = warmthAt(near);\n' +
'    hand.zw += vec2(0.25, 0.05) * warm;\n' +
'  }\n' +
'  vec2 from = p - hand.xy;\n' +
'  vec2 turn = vec2(\n' +
'    noise(vec3(from / u_gust.y, u_time * 0.04), 0x51u),\n' +
'    noise(vec3(from / u_gust.y + 17.3, u_time * 0.04 + 5.0), 0x52u));\n' +
'  vec2 bent = from + u_gust.x * turn;\n' +
'  vec2 q = vec2(dot(bent, heading), dot(bent, across));\n' +
'  float carried = v_air.z;\n' +

  gl.uniform1i(loc(glyphProgram, 'u_boxes'), UNITS.boxes);
  gl.uniform1i(loc(glyphProgram, 'u_sequence'), UNITS.sequence);
  gl.uniform1ui(loc(glyphProgram, 'u_seed'), params2.seed);
  gl.uniform1f(loc(glyphProgram, 'u_fill'), CONFIG.surface.fill);
  gl.uniform1f(loc(glyphProgram, 'u_flick'), CONFIG.wind.flick);
  gl.uniform1f(loc(glyphProgram, 'u_friction'), CONFIG.wind.friction);
  gl.uniform1f(loc(glyphProgram, 'u_glowAmount'), CONFIG.glow.amount);
  applyTheme(THEME);

  var touchLoc = {
    now: loc(windProgram, 'u_now'), tapCount: loc(windProgram, 'u_tapCount'), wakeCount: loc(windProgram, 'u_wakeCount'),
    taps: loc(windProgram, 'u_taps'), wakes: loc(windProgram, 'u_wakes'), ways: loc(windProgram, 'u_ways'),
  };
  var touchLocG = {
    now: loc(glyphProgram, 'u_now'), tapCount: loc(glyphProgram, 'u_tapCount'), wakeCount: loc(glyphProgram, 'u_wakeCount'),
    taps: loc(glyphProgram, 'u_taps'), wakes: loc(glyphProgram, 'u_wakes'), ways: loc(glyphProgram, 'u_ways'),
  };
  var U = {
    cellCss: loc(glyphProgram, 'u_cellCss'), windTime: loc(windProgram, 'u_time'), reveal: loc(windProgram, 'u_reveal'),
    sampleCss: loc(windProgram, 'u_sampleCss'), originCss: loc(windProgram, 'u_originCss'), paneCss: loc(windProgram, 'u_paneCss'),
    canvasCss: loc(windProgram, 'u_canvasCss'), glyphTime: loc(glyphProgram, 'u_time'), count: loc(glyphProgram, 'u_count'),
    grid: loc(glyphProgram, 'u_grid'), cell: loc(glyphProgram, 'u_cell'), buffer: loc(glyphProgram, 'u_buffer'),
  };
  function setTouch(locations, state) {
    gl.uniform1i(locations.tapCount, state ? state.tapCount : 0);
    gl.uniform1i(locations.wakeCount, state ? state.wakeCount : 0);
    if (!state) return;
    gl.uniform1f(locations.now, state.now);
    if (state.tapCount > 0) gl.uniform4fv(locations.taps, state.taps);
    if (state.wakeCount > 0) {
      gl.uniform4fv(locations.wakes, state.wakes);
      gl.uniform4fv(locations.ways, state.ways);
    }
  }

  var columns = 0, rows = 0, cells = 0, atlasCellWidth = 0;
  function rebuildAtlas(cellWidth, cellHeight) {
    var family = 'ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace';
    var atlas = buildAtlas(family, cellWidth, cellHeight);
    if (!atlas) return false;
    var boxes = measureGlyphs(atlas.coverage, cellWidth, cellHeight);
    var sequence = buildSequence(params2.key, atlas.missing);
    upload(gl, UNITS.atlas, 'r8', atlas.width, atlas.height, atlas.coverage);
    upload(gl, UNITS.boxes, 'rgba8ui', GLYPHS.length, 1, boxes);
    upload(gl, UNITS.sequence, 'r8', sequence.length, 1, sequence);
    gl.useProgram(glyphProgram);
    gl.uniform1i(U.count, sequence.length);
    atlasCellWidth = cellWidth;
    return true;
  }

  function resize() {
    var dpr = window.devicePixelRatio || 1;
    var width = Math.max(1, window.innerWidth);
    var height = Math.max(1, window.innerHeight);
    var grid = gridFor(Math.round(width * dpr), Math.round(height * dpr), dpr);
    if (!grid) return false;
    if (grid.cellWidth !== atlasCellWidth && !rebuildAtlas(grid.cellWidth, grid.cellHeight)) return false;
    var bufferWidth = grid.columns * grid.cellWidth;
    var bufferHeight = grid.rows * grid.cellHeight;
    if (canvas.width !== bufferWidth || canvas.height !== bufferHeight) {
      canvas.width = bufferWidth;
      canvas.height = bufferHeight;
    }
    var toCss = function (v) { return v / grid.scale; };
    canvas.style.left = toCss(grid.left) + 'px';
    canvas.style.top = toCss(grid.top) + 'px';
    canvas.style.width = toCss(bufferWidth) + 'px';
    canvas.style.height = toCss(bufferHeight) + 'px';
    if (grid.columns !== columns || grid.rows !== rows) {
      columns = grid.columns;
      rows = grid.rows;
      cells = columns * rows;
      upload(gl, UNITS.wind, 'rgba8', columns, rows * 2, null);
      gl.bindFramebuffer(gl.FRAMEBUFFER, framebuffer);
      gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, windTex, 0);
    }
    gl.useProgram(windProgram);
    gl.uniform2f(U.sampleCss, toCss(grid.cellWidth), toCss(grid.cellHeight) / 2);
    gl.uniform2f(U.originCss, toCss(grid.left), toCss(grid.top));
    gl.uniform2f(U.paneCss, width, height);
    gl.uniform2f(U.canvasCss, toCss(bufferWidth), toCss(bufferHeight));
    gl.useProgram(glyphProgram);
    gl.uniform2i(U.grid, columns, rows);
    gl.uniform4f(U.cellCss, toCss(grid.left + grid.cellWidth / 2), toCss(grid.top + grid.cellHeight / 2), toCss(grid.cellWidth), toCss(grid.cellHeight));
    gl.uniform2i(U.cell, grid.cellWidth, grid.cellHeight);
    gl.uniform2i(U.buffer, bufferWidth, bufferHeight);
    return true;
  }

  function draw(time, reveal, state) {
    if (!cells) return;
    gl.bindFramebuffer(gl.FRAMEBUFFER, framebuffer);
    gl.viewport(0, 0, columns, rows * 2);
    gl.useProgram(windProgram);
    gl.uniform1f(U.windTime, time);
    gl.uniform1f(U.reveal, reveal);
    setTouch(touchLoc, state);
    gl.drawArrays(gl.TRIANGLES, 0, 3);

    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.clearColor(0, 0, 0, 0);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.useProgram(glyphProgram);
    gl.uniform1f(U.glyphTime, time);
    setTouch(touchLocG, state);
    gl.drawArrays(gl.TRIANGLES, 0, 6 * cells);
  }

  // ------------------------------------------------------------------ touch

  var TAP_LIFE = 3.6, WAKE_LIFE = 2.4, MOVE_GAP = 0.25, MIN_AGE = 0.035, MIN_TRAVEL = 18;
  var SPEED_SMOOTH = 0.08, FORCE_FALLOFF = 90, WARM_UP = 0.05, WARM_DECAY = 0.65;
  var WAKE_RADIUS = 50, WAKE_GROWTH = 40, MIN_WAKE = 0.002, HEART_EVERY = 3;

  var taps = [], wakes = [], lastMove = null, previous = null, pointerSpeed = 0, tapCount = 0;
  var touchState = {
    now: 0, tapCount: 0, taps: new Float32Array(24),
    wakeCount: 0, wakes: new Float32Array(192), ways: new Float32Array(192),
  };
  function move(x, y, now) {
    if (!lastMove || !previous || now - lastMove.at > MOVE_GAP) {
      lastMove = { x: x, y: y, at: now };
      previous = lastMove;
      pointerSpeed = 0;
      return;
    }
    var dt = Math.max(now - lastMove.at, 1 / 240);
    var distance = Math.hypot(x - lastMove.x, y - lastMove.y);
    pointerSpeed += (distance / dt - pointerSpeed) * Math.min(1, dt / SPEED_SMOOTH);
    lastMove = { x: x, y: y, at: now };
    var travel = Math.hypot(x - previous.x, y - previous.y);
    if (travel < MIN_TRAVEL || now - previous.at < MIN_AGE) return;
    var slow = CONFIG.touch.slowPxS, fast = CONFIG.touch.fastPxS;
    var t = Math.min(1, Math.max(0, (pointerSpeed - slow) / (fast - slow)));
    var force = CONFIG.touch.stir * t * t * (3 - 2 * t);
    var from = previous;
    previous = lastMove;
    if (force < 0.04) return;
    wakes = wakes.slice(-47).concat([{
      x: (x + from.x) / 2, y: (y + from.y) / 2, at: now,
      force: force * travel / (travel + FORCE_FALLOFF),
      wayX: (x - from.x) / 2, wayY: (y - from.y) / 2,
    }]);
  }
  function tap(x, y, now) {
    tapCount += 1;
    var force = tapCount % HEART_EVERY === 0 ? -1.15 * CONFIG.touch.ripple : CONFIG.touch.ripple;
    taps = taps.slice(-5).concat([{ x: x, y: y, at: now, force: force, wayX: 0, wayY: 0 }]);
  }
  function busy(now) {
    return taps.some(function (t) { return now - t.at < TAP_LIFE; }) || wakes.some(function (w) { return now - w.at < WAKE_LIFE; });
  }
  function frameTouch(now) {
    taps = taps.filter(function (t) { return now - t.at < TAP_LIFE; });
    wakes = wakes.filter(function (w) { return now - w.at < WAKE_LIFE; });
    touchState.now = now;
    touchState.tapCount = taps.length;
    taps.forEach(function (t, i) { touchState.taps.set([t.x, t.y, t.at, t.force], i * 4); });
    var rest = 48 - wakes.length, count = 0;
    wakes.forEach(function (w, index) {
      var age = Math.max(0, now - w.at);
      var force = w.force * Math.min(1, (index + 1 + rest) / 8) * (1 - Math.exp(-age / WARM_UP)) * Math.exp(-age / WARM_DECAY);
      if (force < MIN_WAKE) return;
      var radius = WAKE_RADIUS + WAKE_GROWTH * age;
      var length = Math.hypot(w.wayX, w.wayY);
      touchState.wakes.set([w.x, w.y, force, 1 / (radius * radius)], count * 4);
      touchState.ways.set([w.wayX / (length || 1), w.wayY / (length || 1), length, 0], count * 4);
      count += 1;
    });
    touchState.wakeCount = count;
    return touchState;
  }

  // ------------------------------------------------------------------- loop

  var AUTO = params.get('auto') !== '0';
  var clock = 0, start = 0, reveal = 0, before = performance.now();
  var raf = 0, timer = 0, nextAuto = 4 + Math.random() * 6;
  var hint = document.getElementById('hint');
  if (CAPTURE) hint.style.display = 'none';
  var hintGone = false;

  function hideHint() {
    if (hintGone) return;
    hintGone = true;
    hint.classList.add('gone');
  }

  function schedule(delay) {
    if (timer) clearTimeout(timer);
    timer = setTimeout(function () {
      timer = 0;
      raf = requestAnimationFrame(loop);
    }, delay);
  }

  function loop(now) {
    raf = 0;
    var dt = Math.min(Math.max(now - before, 0), 250);
    before = now;
    clock += dt / 1000;
    if (!start) start = clock;
    reveal = (function (t) {
      t = Math.min(1, Math.max(0, t));
      return t * t * (3 - 2 * t);
    })((clock - start) / CONFIG.wind.revealS);

    if (AUTO && clock > nextAuto) {
      nextAuto = clock + 7 + Math.random() * 8;
      tap(window.innerWidth * (0.15 + Math.random() * 0.7), window.innerHeight * (0.18 + Math.random() * 0.64), clock);
    }

    draw(clock * CONFIG.wind.energy, reveal, frameTouch(clock));
    canvas.style.opacity = String(OPACITY);
    schedule(busy(clock) ? CONFIG.power.rippleFrameMs : CONFIG.power.frameMs);
  }

  window.addEventListener('pointermove', function (event) {
    hideHint();
    move(event.clientX, event.clientY, clock);
  }, { passive: true });
  window.addEventListener('pointerdown', function (event) {
    hideHint();
    if (event.button === 0) tap(event.clientX, event.clientY, clock);
  }, { passive: true });
  window.addEventListener('pointerleave', function () {
    lastMove = null;
  }, { passive: true });

  var resizeTimer = 0;
  window.addEventListener('resize', function () {
    if (resizeTimer) clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      resizeTimer = 0;
      resize();
    }, CONFIG.power.resizeSettleMs);
  });
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) {
      if (raf) cancelAnimationFrame(raf);
      raf = 0;
      if (timer) clearTimeout(timer);
      timer = 0;
      return;
    }
    before = performance.now();
    schedule(0);
  });

  if (resize()) schedule(0);
  watchTheme();
  setTimeout(hideHint, 9000);
})();
</script>
</body>
</html>
